# Typezero ThemeEngine theme
# Everforest Dark uses the project's muted green and earth-tone palette to
# provide a softer, natural alternative to Typezero's colder dark themes.
# Dark Medium is used as the baseline for balanced contrast and readability.
THEME_ID=everforest-dark
THEME_NAME="Everforest Dark"

# Typography
# Typography remains a Typezero environment choice rather than part of the
# upstream color scheme, keeping layout and metrics consistent across themes.
FONT_FAMILY="JetBrainsMono Nerd Font Mono"
FONT_STYLE="SemiBold"
# The i3 status bar deliberately uses compact 11 pt text in a 32 px bar.
# This keeps Arakiel's telemetry dense and readable without consuming
# unnecessary vertical workspace on the desktop.
BAR_FONT="JetBrainsMono Nerd Font Mono SemiBold 11"
BAR_HEIGHT=32
XFT_FONT="JetBrainsMono Nerd Font Mono:style=SemiBold:size=11"

# Core palette
# Dark Medium backgrounds establish the forest-charcoal foundation. Gray
# levels provide structural separation while the warm foreground keeps text
# readable without the stark contrast of a pure white-on-black theme.
BG=#2D353B
SURFACE=#272E33
SURFACE_ALT=#343F44
BORDER_DARK=#3D484D
BORDER=#475258
MUTED=#859289
TEXT=#D3C6AA
BRIGHT=#D8CAAC
ACCENT=#A7C080
ACCENT_BRIGHT=#83C092

# Semantic accents
# Everforest's native green, yellow, red, purple, and blue accents map directly
# onto ThemeEngine's semantic roles so status information retains the identity
# and restrained contrast of the original palette.
SUCCESS=#A7C080
WARNING=#DBBC7F
ERROR=#E67E80
SECONDARY=#D699B6
INFO=#7FBBB3

# i3 workspace/client roles
# Green identifies focus, while progressively darker gray-green surfaces step
# active and inactive windows into the background. Urgent windows use the
# native Everforest red against the deepest surface layer.
FOCUSED_BORDER=#A7C080
FOCUSED_BG=#343F44
ACTIVE_BORDER=#475258
ACTIVE_BG=#272E33
INACTIVE_BORDER=#3D484D
INACTIVE_BG=#2D353B
URGENT_BORDER=#E67E80
URGENT_BG=#272E33

# ANSI terminal palette
# ANSI roles stay within the Everforest Dark palette. Normal colors provide
# the primary semantic set while brighter complementary accents give terminal
# applications enough distinction without introducing neon saturation.
ANSI_BLACK=#475258
ANSI_RED=#E67E80
ANSI_GREEN=#A7C080
ANSI_YELLOW=#DBBC7F
ANSI_BLUE=#7FBBB3
ANSI_PURPLE=#D699B6
ANSI_CYAN=#83C092
ANSI_WHITE=#D3C6AA

ANSI_BRIGHT_BLACK=#859289
ANSI_BRIGHT_RED=#E67E80
ANSI_BRIGHT_GREEN=#A7C080
ANSI_BRIGHT_YELLOW=#DBBC7F
ANSI_BRIGHT_BLUE=#7FBBB3
ANSI_BRIGHT_PURPLE=#D699B6
ANSI_BRIGHT_CYAN=#83C092
ANSI_BRIGHT_WHITE=#D8CAAC
