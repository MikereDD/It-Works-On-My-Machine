# Typezero ThemeEngine theme
#
# Gruvbox-inspired dark theme. The palette preserves Gruvbox's warm,
# retro character while mapping its colors onto ThemeEngine's semantic
# roles for i3, i3blocks, tmux, Xresources, and shell UI consumers.
THEME_ID=gruvbox
THEME_NAME="Gruvbox Dark"

# Typography
# Keep typography consistent across themes so switching color schemes
# does not unexpectedly change geometry, bar sizing, or terminal layout.
FONT_FAMILY="JetBrainsMono Nerd Font"
FONT_STYLE="Regular"
BAR_FONT="JetBrainsMono Nerd Font Regular 12"
BAR_HEIGHT=38
XFT_FONT="JetBrainsMono Nerd Font:style=Regular:size=13"

# Core palette
# Based on the classic Gruvbox dark palette:
#   dark0        #282828
#   dark1        #3C3836
#   dark2        #504945
#   dark3        #665C54
#   dark4        #7C6F64
#   light1       #EBDBB2
#   light0       #FBF1C7
BG=#282828
SURFACE=#32302F
SURFACE_ALT=#3C3836
BORDER_DARK=#504945
BORDER=#665C54
MUTED=#928374
TEXT=#EBDBB2
BRIGHT=#FBF1C7
ACCENT=#D79921
ACCENT_BRIGHT=#FABD2F

# Semantic accents
# Gruvbox's muted variants are favored for persistent UI elements;
# brighter colors remain available where stronger emphasis is useful.
SUCCESS=#98971A
WARNING=#D79921
ERROR=#CC241D
SECONDARY=#B16286
INFO=#458588

# i3 workspace/client roles
# Window borders stay mostly within Gruvbox's neutral brown/gray range.
# Focus receives a warm accent without turning every window edge bright.
FOCUSED_BORDER=#D79921
FOCUSED_BG=#3C3836
ACTIVE_BORDER=#665C54
ACTIVE_BG=#32302F
INACTIVE_BORDER=#504945
INACTIVE_BG=#282828
URGENT_BORDER=#CC241D
URGENT_BG=#3C1F1E

# ANSI terminal palette
# These values provide the complete Gruvbox Dark 16-color terminal palette
# for consumers such as Windows Terminal. Keeping them in the shared theme
# definition prevents platform renderers from hard-coding theme-specific
# colors and allows future themes to provide their own terminal palettes.
ANSI_BLACK=#282828
ANSI_RED=#CC241D
ANSI_GREEN=#98971A
ANSI_YELLOW=#D79921
ANSI_BLUE=#458588
ANSI_PURPLE=#B16286
ANSI_CYAN=#689D6A
ANSI_WHITE=#A89984

ANSI_BRIGHT_BLACK=#928374
ANSI_BRIGHT_RED=#FB4934
ANSI_BRIGHT_GREEN=#B8BB26
ANSI_BRIGHT_YELLOW=#FABD2F
ANSI_BRIGHT_BLUE=#83A598
ANSI_BRIGHT_PURPLE=#D3869B
ANSI_BRIGHT_CYAN=#8EC07C
ANSI_BRIGHT_WHITE=#EBDBB2
