# Typezero ThemeEngine theme
THEME_ID=obsidian-silver
THEME_NAME="Obsidian Silver"

# Typography
FONT_FAMILY="JetBrainsMono Nerd Font Mono"
FONT_STYLE="SemiBold"
# The i3 status bar deliberately uses compact 11 pt text in a 32 px bar.
# This keeps Arakiel's telemetry dense and readable without consuming
# unnecessary vertical workspace on the desktop.
BAR_FONT="JetBrainsMono Nerd Font Mono SemiBold 11"
BAR_HEIGHT=32
XFT_FONT="JetBrainsMono Nerd Font Mono:style=Medium:size=11"

# Core palette
BG=#050607
SURFACE=#0B0D0F
SURFACE_ALT=#111417
BORDER_DARK=#25292C
BORDER=#4E565F
MUTED=#7A8187
TEXT=#D6D9DC
BRIGHT=#F2F3F4
ACCENT=#969DA3
ACCENT_BRIGHT=#BBC0C4

# Semantic accents
SUCCESS=#87978E
WARNING=#B49A70
ERROR=#98565C
SECONDARY=#8C8392
INFO=#8D99A4

# i3 workspace/client roles
FOCUSED_BORDER=#737A80
FOCUSED_BG=#151719
ACTIVE_BORDER=#4B5156
ACTIVE_BG=#0D0F10
INACTIVE_BORDER=#25292C
INACTIVE_BG=#050607
URGENT_BORDER=#8A4B50
URGENT_BG=#241113

# ANSI terminal palette
# Obsidian Silver keeps terminal output subdued and metallic rather than using
# saturated console colors. Semantic hues remain recognizable for errors,
# success, warnings, information, and secondary output while staying within
# the theme's low-saturation silver/obsidian visual language.
#
# The normal palette reuses established ThemeEngine semantic colors wherever
# possible. Bright variants increase contrast without introducing unrelated
# high-saturation colors, keeping Windows Terminal visually consistent with
# the rest of the Obsidian Silver environment.
ANSI_BLACK=#050607
ANSI_RED=#98565C
ANSI_GREEN=#87978E
ANSI_YELLOW=#B49A70
ANSI_BLUE=#8D99A4
ANSI_PURPLE=#8C8392
ANSI_CYAN=#82999A
ANSI_WHITE=#BBC0C4

ANSI_BRIGHT_BLACK=#7A8187
ANSI_BRIGHT_RED=#B86E74
ANSI_BRIGHT_GREEN=#A4B5AB
ANSI_BRIGHT_YELLOW=#D0B486
ANSI_BRIGHT_BLUE=#AAB8C4
ANSI_BRIGHT_PURPLE=#AAA0B0
ANSI_BRIGHT_CYAN=#9DB8B9
ANSI_BRIGHT_WHITE=#F2F3F4
