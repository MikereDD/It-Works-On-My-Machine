# Typezero ThemeEngine theme
#
# Nord maps the canonical Arctic Ice Studio Nord palette into ThemeEngine's
# shared semantic roles.
#
# Polar Night provides the structural dark layers.
# Snow Storm provides readable foregrounds.
# Frost provides the primary theme identity and informational accents.
# Aurora provides semantic success, warning, error, and secondary accents.
THEME_ID=nord
THEME_NAME="Nord"

# Typography
FONT_FAMILY="JetBrainsMono Nerd Font Mono"
FONT_STYLE="SemiBold"
BAR_FONT="JetBrainsMono Nerd Font Mono SemiBold 11"
BAR_HEIGHT=32
XFT_FONT="JetBrainsMono Nerd Font Mono:style=Medium:size=11"

# Core palette
#
# Polar Night
# nord0 #2E3440
# nord1 #3B4252
# nord2 #434C5E
# nord3 #4C566A
#
# Snow Storm
# nord4 #D8DEE9
# nord5 #E5E9F0
# nord6 #ECEFF4
#
# Frost
# nord7  #8FBCBB
# nord8  #88C0D0
# nord9  #81A1C1
# nord10 #5E81AC
BG=#2E3440
SURFACE=#3B4252
SURFACE_ALT=#434C5E
BORDER_DARK=#434C5E
BORDER=#4C566A
MUTED=#4C566A
TEXT=#D8DEE9
BRIGHT=#ECEFF4
ACCENT=#81A1C1
ACCENT_BRIGHT=#88C0D0

# Interaction states
SELECTION=#434C5E
CURSOR=#D8DEE9
FOCUS=#88C0D0

# Aurora semantic accents
SUCCESS=#A3BE8C
WARNING=#EBCB8B
ERROR=#BF616A
SECONDARY=#B48EAD
INFO=#8FBCBB

# i3 workspace/client roles
FOCUSED_BORDER=#88C0D0
FOCUSED_BG=#3B4252
ACTIVE_BORDER=#81A1C1
ACTIVE_BG=#3B4252
INACTIVE_BORDER=#434C5E
INACTIVE_BG=#2E3440
URGENT_BORDER=#BF616A
URGENT_BG=#3B4252

# ANSI terminal palette
ANSI_BLACK=#3B4252
