# Typezero ThemeEngine theme
# Catppuccin Mocha is the darkest Catppuccin flavor. This definition maps the
# official Mocha palette into ThemeEngine's shared semantic roles so the same
# theme identity can be rendered consistently on Arakiel and Netzach.
THEME_ID=catppuccin-mocha
THEME_NAME="Catppuccin Mocha"

# Typography
# Typography remains part of the Typezero environment rather than the upstream
# Catppuccin palette, keeping terminal and desktop metrics consistent between
# themes while colors change around them.
FONT_FAMILY="JetBrainsMono Nerd Font Mono"
FONT_STYLE="SemiBold"
BAR_FONT="JetBrainsMono Nerd Font Mono SemiBold 13"
BAR_HEIGHT=42
XFT_FONT="JetBrainsMono Nerd Font Mono:style=SemiBold:size=11"

# Core palette
# Catppuccin's Base/Mantle/Crust provide the dark structural layers. Surface
# and Overlay colors provide progressively stronger borders and muted content,
# while Text and Lavender form the primary readable/bright hierarchy.
BG=#1E1E2E
SURFACE=#181825
SURFACE_ALT=#313244
BORDER_DARK=#45475A
BORDER=#585B70
MUTED=#7F849C
TEXT=#CDD6F4
BRIGHT=#F5E0DC
ACCENT=#CBA6F7
ACCENT_BRIGHT=#B4BEFE

# Semantic accents
# These roles use official Mocha accent colors directly. They intentionally
# remain pastel rather than being intensified so status information retains
# Catppuccin's characteristic soft contrast.
SUCCESS=#A6E3A1
WARNING=#F9E2AF
ERROR=#F38BA8
SECONDARY=#F5C2E7
INFO=#89B4FA

# i3 workspace/client roles
# Focus uses Mauve as the strongest identity cue. Active and inactive clients
# step down through Surface/Overlay colors, while urgent windows use Red over
# the darker Mantle layer for visibility without introducing foreign colors.
FOCUSED_BORDER=#CBA6F7
FOCUSED_BG=#313244
ACTIVE_BORDER=#585B70
ACTIVE_BG=#181825
INACTIVE_BORDER=#45475A
INACTIVE_BG=#1E1E2E
URGENT_BORDER=#F38BA8
URGENT_BG=#181825

# ANSI terminal palette
# The terminal palette is composed entirely from official Catppuccin Mocha
# colors. Normal entries favor the core semantic accents; bright entries use
# complementary Mocha accents and lighter text colors to increase distinction
# without leaving the upstream palette.
ANSI_BLACK=#45475A
ANSI_RED=#F38BA8
ANSI_GREEN=#A6E3A1
ANSI_YELLOW=#F9E2AF
ANSI_BLUE=#89B4FA
ANSI_PURPLE=#F5C2E7
ANSI_CYAN=#94E2D5
ANSI_WHITE=#BAC2DE

ANSI_BRIGHT_BLACK=#585B70
ANSI_BRIGHT_RED=#EBA0AC
ANSI_BRIGHT_GREEN=#A6E3A1
ANSI_BRIGHT_YELLOW=#FAB387
ANSI_BRIGHT_BLUE=#74C7EC
ANSI_BRIGHT_PURPLE=#CBA6F7
ANSI_BRIGHT_CYAN=#89DCEB
ANSI_BRIGHT_WHITE=#CDD6F4
