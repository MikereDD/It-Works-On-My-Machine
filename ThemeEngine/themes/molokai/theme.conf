# Typezero ThemeEngine theme
#
# Molokai maps Tomas Restrepo's default dark Molokai Vim palette into
# ThemeEngine's shared semantic roles.
#
# Source:
#   https://github.com/tomasr/molokai
#
# This uses Molokai's default darker background variant (#1B1D1E), not the
# optional g:molokai_original=1 Monokai-style background (#272822).
#
# Core source colors retained here include:
#   background  #1B1D1E
#   foreground  #F8F8F2
#   pink        #F92672
#   green       #A6E22E
#   yellow      #E6DB74
#   cyan        #66D9EF
#   orange      #FD971F
#   purple      #AE81FF
THEME_ID=molokai
THEME_NAME="Molokai"

# Typography
FONT_FAMILY="JetBrainsMono Nerd Font Mono"
FONT_STYLE="SemiBold"
BAR_FONT="JetBrainsMono Nerd Font Mono SemiBold 11"
BAR_HEIGHT=32
XFT_FONT="JetBrainsMono Nerd Font Mono:style=Medium:size=11"

# Core semantic palette
BG=#1B1D1E
SURFACE=#232526
SURFACE_ALT=#293739
BORDER_DARK=#465457
BORDER=#808080
MUTED=#7E8E91
TEXT=#F8F8F2
BRIGHT=#FFFFFF
ACCENT=#66D9EF
ACCENT_BRIGHT=#70F0F0

# Interaction states
SELECTION=#403D3D
CURSOR=#F8F8F0
FOCUS=#66D9EF

# Semantic accents
SUCCESS=#A6E22E
WARNING=#E6DB74
ERROR=#F92672
SECONDARY=#AE81FF
INFO=#66D9EF

# i3 workspace/client roles
FOCUSED_BORDER=#66D9EF
FOCUSED_BG=#293739
ACTIVE_BORDER=#FD971F
ACTIVE_BG=#232526
INACTIVE_BORDER=#465457
INACTIVE_BG=#1B1D1E
URGENT_BORDER=#F92672
URGENT_BG=#1E0010

# ANSI terminal palette
ANSI_BLACK=#1B1D1E
ANSI_RED=#F92672
ANSI_GREEN=#A6E22E
ANSI_YELLOW=#E6DB74
ANSI_BLUE=#7070F0
ANSI_PURPLE=#AE81FF
ANSI_CYAN=#66D9EF
ANSI_WHITE=#F8F8F2

ANSI_BRIGHT_BLACK=#7E8E91
ANSI_BRIGHT_RED=#F92672
ANSI_BRIGHT_GREEN=#A6E22E
ANSI_BRIGHT_YELLOW=#FFE792
ANSI_BRIGHT_BLUE=#7070F0
ANSI_BRIGHT_PURPLE=#AE81FF
ANSI_BRIGHT_CYAN=#70F0F0
ANSI_BRIGHT_WHITE=#FFFFFF
