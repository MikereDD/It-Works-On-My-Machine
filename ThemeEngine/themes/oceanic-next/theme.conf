# Typezero ThemeEngine theme
#
# Oceanic Next maps the published Oceanic Next / Base16 palette into
# ThemeEngine's shared semantic roles.
#
# Source:
#   https://github.com/voronianski/oceanic-next-color-scheme
#
# Published palette:
#   base00 #1B2B34
#   base01 #343D46
#   base02 #4F5B66
#   base03 #65737E
#   base04 #A7ADBA
#   base05 #C0C5CE
#   base06 #CDD3DE
#   base07 #D8DEE9
#   base08 #EC5F67
#   base09 #F99157
#   base0A #FAC863
#   base0B #99C794
#   base0C #5FB3B3
#   base0D #6699CC
#   base0E #C594C5
#   base0F #AB7967
THEME_ID=oceanic-next
THEME_NAME="Oceanic Next"

# Typography
FONT_FAMILY="JetBrainsMono Nerd Font Mono"
FONT_STYLE="SemiBold"
BAR_FONT="JetBrainsMono Nerd Font Mono SemiBold 11"
BAR_HEIGHT=32
XFT_FONT="JetBrainsMono Nerd Font Mono:style=Medium:size=11"

# Core semantic palette
BG=#1B2B34
SURFACE=#343D46
SURFACE_ALT=#4F5B66
BORDER_DARK=#4F5B66
BORDER=#65737E
MUTED=#65737E
TEXT=#C0C5CE
BRIGHT=#D8DEE9
ACCENT=#6699CC
ACCENT_BRIGHT=#5FB3B3

# Interaction states
SELECTION=#4F5B66
CURSOR=#CDD3DE
FOCUS=#6699CC

# Semantic accents
SUCCESS=#99C794
WARNING=#FAC863
ERROR=#EC5F67
SECONDARY=#C594C5
INFO=#5FB3B3

# i3 workspace/client roles
FOCUSED_BORDER=#6699CC
FOCUSED_BG=#343D46
ACTIVE_BORDER=#F99157
ACTIVE_BG=#343D46
INACTIVE_BORDER=#4F5B66
INACTIVE_BG=#1B2B34
URGENT_BORDER=#EC5F67
URGENT_BG=#343D46

# ANSI terminal palette
ANSI_BLACK=#1B2B34
ANSI_RED=#EC5F67
ANSI_GREEN=#99C794
ANSI_YELLOW=#FAC863
ANSI_BLUE=#6699CC
ANSI_PURPLE=#C594C5
ANSI_CYAN=#5FB3B3
ANSI_WHITE=#C0C5CE

ANSI_BRIGHT_BLACK=#65737E
ANSI_BRIGHT_RED=#EC5F67
ANSI_BRIGHT_GREEN=#99C794
ANSI_BRIGHT_YELLOW=#FAC863
