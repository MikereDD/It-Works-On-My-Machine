# Typezero ThemeEngine theme
# Dusty's Pink AF Theme uses a near-black magenta foundation with bright pink
# identity colors and deliberately vivid semantic accents. It originated as a
# contributed ThemeEngine palette and is kept intentionally loud while still
# following the shared semantic-role contract.
THEME_ID=dustys-pink-af
THEME_NAME="Dusty's Pink AF Theme"

# Typography
# Preserve the established Typezero metrics so changing to this palette does
# not unexpectedly alter terminal or desktop geometry.
FONT_FAMILY="JetBrainsMono Nerd Font Mono"
FONT_STYLE="SemiBold"
BAR_FONT="JetBrainsMono Nerd Font Mono SemiBold 11"
BAR_HEIGHT=32
XFT_FONT="JetBrainsMono Nerd Font Mono:style=Medium:size=11"

# Core palette
# Near-black surfaces keep the saturated pink identity readable rather than
# allowing every part of the UI to compete at full intensity.
BG=#12000A
SURFACE=#21000F
SURFACE_ALT=#350019
BORDER_DARK=#59002B
BORDER=#B00054
MUTED=#B87596
TEXT=#FFE5F1
BRIGHT=#FFFFFF
ACCENT=#FF0077
ACCENT_BRIGHT=#FF73B5

# Interaction-state roles
# These explicitly override ThemeEngine's backwards-compatible defaults so the
# palette can tune selections, cursors, and focused UI independently.
SELECTION=#A80050
CURSOR=#FF73B5
FOCUS=#FF0077

# Semantic accents
# These colors remain intentionally vivid but keep success, warning, error,
# secondary, and informational states visually distinct.
SUCCESS=#39FF88
WARNING=#FFE14D
ERROR=#FF335F
SECONDARY=#B87CFF
INFO=#4DCCFF

# i3 workspace/client roles
FOCUSED_BORDER=#FF0077
FOCUSED_BG=#410020
ACTIVE_BORDER=#B00054
ACTIVE_BG=#260011
INACTIVE_BORDER=#59002B
INACTIVE_BG=#12000A
URGENT_BORDER=#FF335F
URGENT_BG=#4A001A

# ANSI terminal palette
ANSI_BLACK=#12000A
ANSI_RED=#FF335F
ANSI_GREEN=#39FF88
ANSI_YELLOW=#FFE14D
ANSI_BLUE=#4DCCFF
ANSI_PURPLE=#B87CFF
ANSI_CYAN=#00F5D4
ANSI_WHITE=#FFE5F1

ANSI_BRIGHT_BLACK=#B87596
ANSI_BRIGHT_RED=#FF7794
ANSI_BRIGHT_GREEN=#8DFFBB
ANSI_BRIGHT_YELLOW=#FFF19A
ANSI_BRIGHT_BLUE=#8BDEFF
ANSI_BRIGHT_PURPLE=#D0AFFF
ANSI_BRIGHT_CYAN=#7DFFED
ANSI_BRIGHT_WHITE=#FFFFFF
