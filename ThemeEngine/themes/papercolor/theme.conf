# Typezero ThemeEngine theme
#
# PaperColor maps the canonical PaperColor Dark palette by
# Nikyle Nguyen into ThemeEngine's shared semantic roles.
#
# Source:
#   https://github.com/NLKNguyen/papercolor-theme
#
# This uses the original PaperColor "default.dark" variant.
#
# Canonical terminal palette:
#   color00 #1C1C1C
#   color01 #AF005F
#   color02 #5FAF00
#   color03 #D7AF5F
#   color04 #5FAFD7
#   color05 #808080
#   color06 #D7875F
#   color07 #D0D0D0
#   color08 #585858
#   color09 #5FAF5F
#   color10 #AFD700
#   color11 #AF87D7
#   color12 #FFAF00
#   color13 #FF5FAF
#   color14 #00AFAF
#   color15 #5F8787
THEME_ID=papercolor
THEME_NAME="PaperColor"

# Typography
FONT_FAMILY="JetBrainsMono Nerd Font Mono"
FONT_STYLE="SemiBold"
BAR_FONT="JetBrainsMono Nerd Font Mono SemiBold 11"
BAR_HEIGHT=32
XFT_FONT="JetBrainsMono Nerd Font Mono:style=Medium:size=11"

# Core semantic palette
BG=#1C1C1C
SURFACE=#262626
SURFACE_ALT=#303030
BORDER_DARK=#3A3A3A
BORDER=#5F8787
MUTED=#808080
TEXT=#C6C6C6
BRIGHT=#D0D0D0
ACCENT=#00AFAF
ACCENT_BRIGHT=#5FAFD7

# Interaction states
SELECTION=#8787AF
CURSOR=#C6C6C6
FOCUS=#00AFAF

# Semantic accents
SUCCESS=#5FAF00
WARNING=#D7AF5F
ERROR=#AF005F
SECONDARY=#AF87D7
INFO=#5FAFD7

# i3 workspace/client roles
FOCUSED_BORDER=#00AFAF
FOCUSED_BG=#303030
ACTIVE_BORDER=#FFAF00
ACTIVE_BG=#262626
INACTIVE_BORDER=#585858
INACTIVE_BG=#1C1C1C
URGENT_BORDER=#AF005F
URGENT_BG=#5F0000

# ANSI terminal palette
#
# These intentionally preserve PaperColor's canonical color00-color15
# terminal assignments rather than remapping them by visual hue.
ANSI_BLACK=#1C1C1C
ANSI_RED=#AF005F
ANSI_GREEN=#5FAF00
ANSI_YELLOW=#D7AF5F
ANSI_BLUE=#5FAFD7
ANSI_PURPLE=#808080
ANSI_CYAN=#D7875F
ANSI_WHITE=#D0D0D0

ANSI_BRIGHT_BLACK=#585858
ANSI_BRIGHT_RED=#5FAF5F
ANSI_BRIGHT_GREEN=#AFD700
ANSI_BRIGHT_YELLOW=#AF87D7
ANSI_BRIGHT_BLUE=#FFAF00
ANSI_BRIGHT_PURPLE=#FF5FAF
ANSI_BRIGHT_CYAN=#00AFAF
ANSI_BRIGHT_WHITE=#5F8787
