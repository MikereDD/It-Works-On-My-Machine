# Typezero ThemeEngine theme
# OneDark maps navarasu/onedark.nvim's default dark palette into ThemeEngine's
# shared semantic roles. This intentionally uses the upstream "dark" variant,
# not the darker/cool/deep/warm alternatives.
THEME_ID=onedark
THEME_NAME="OneDark"

# Typography
# Typography remains part of the Typezero environment rather than the upstream
# palette so terminal and desktop metrics stay consistent between themes.
FONT_FAMILY="JetBrainsMono Nerd Font Mono"
FONT_STYLE="SemiBold"
# The i3 status bar deliberately uses compact 11 pt text in a 32 px bar.
# This keeps Arakiel's telemetry dense and readable without consuming
# unnecessary vertical workspace on the desktop.
BAR_FONT="JetBrainsMono Nerd Font Mono SemiBold 11"
BAR_HEIGHT=32
XFT_FONT="JetBrainsMono Nerd Font Mono:style=Medium:size=11"

# Core palette
# bg0 is the canonical OneDark background. bg_d/bg1 provide the surrounding
# dark structural layers while grey/light_grey create the border/muted ladder.
BG=#282C34
SURFACE=#21252B
SURFACE_ALT=#31353F
BORDER_DARK=#393F4A
BORDER=#5C6370
MUTED=#848B98
TEXT=#ABB2BF
BRIGHT=#ABB2BF
ACCENT=#61AFEF
ACCENT_BRIGHT=#73B8F1

# Semantic accents
# These values are taken directly from the default dark OneDark palette.
SUCCESS=#98C379
WARNING=#E5C07B
ERROR=#E86671
SECONDARY=#C678DD
INFO=#56B6C2

# i3 workspace/client roles
# Blue provides the strongest identity cue for focus. Active/inactive clients
# step down through the native bg/grey shades and urgent windows use the
# upstream red over its diff-delete background.
FOCUSED_BORDER=#61AFEF
FOCUSED_BG=#31353F
ACTIVE_BORDER=#5C6370
ACTIVE_BG=#21252B
INACTIVE_BORDER=#393F4A
INACTIVE_BG=#282C34
URGENT_BORDER=#E86671
URGENT_BG=#382B2C

# ANSI terminal palette
# The normal palette uses the upstream OneDark dark colors directly. Bright
# entries remain inside that same palette, using bg_blue/bg_yellow where the
# upstream palette provides explicit brighter counterparts.
ANSI_BLACK=#181A1F
ANSI_RED=#E86671
ANSI_GREEN=#98C379
ANSI_YELLOW=#E5C07B
ANSI_BLUE=#61AFEF
ANSI_PURPLE=#C678DD
ANSI_CYAN=#56B6C2
ANSI_WHITE=#ABB2BF

ANSI_BRIGHT_BLACK=#5C6370
ANSI_BRIGHT_RED=#E86671
ANSI_BRIGHT_GREEN=#98C379
ANSI_BRIGHT_YELLOW=#EBD09C
ANSI_BRIGHT_BLUE=#73B8F1
ANSI_BRIGHT_PURPLE=#C678DD
ANSI_BRIGHT_CYAN=#56B6C2
ANSI_BRIGHT_WHITE=#ABB2BF
