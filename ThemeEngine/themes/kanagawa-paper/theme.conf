# Typezero ThemeEngine theme
# Kanagawa Paper maps the upstream kanagawa-paper.nvim Ink palette into
# ThemeEngine's shared semantic roles. Ink is the project's canonical dark
# variant and preserves the subdued paper/ink character across both systems.
THEME_ID=kanagawa-paper
THEME_NAME="Kanagawa Paper"

# Typography
# Typography remains part of the Typezero environment rather than the upstream
# palette so terminal and desktop metrics stay consistent between themes.
FONT_FAMILY="JetBrainsMono Nerd Font Mono"
FONT_STYLE="SemiBold"
# The i3 status bar deliberately uses compact 11 pt text in a 32 px bar.
# This keeps Arakiel's telemetry dense and readable without consuming
# unnecessary vertical workspace on the desktop.
BAR_FONT="JetBrainsMono Nerd Font Mono SemiBold 11"
BAR_HEIGHT=32
XFT_FONT="JetBrainsMono Nerd Font Mono:style=Medium:size=11"

# Core palette
# sumiInk shades provide the structural layers; Fuji colors provide readable
# foregrounds. Dragon Yellow is the Ink variant's documented primary accent.
BG=#1F1F28
SURFACE=#181820
SURFACE_ALT=#2A2A37
BORDER_DARK=#393836
BORDER=#625E5A
MUTED=#727169
TEXT=#DCD7BA
BRIGHT=#DCD7BA
ACCENT=#C4B28A
ACCENT_BRIGHT=#E6C384

# Semantic accents
# These roles stay within the upstream Ink/Dragon palette: green for success,
# yellow for warning, red for error, pink for secondary emphasis, and blue for
# informational state.
SUCCESS=#699469
WARNING=#C4B28A
ERROR=#C4746E
SECONDARY=#A292A3
INFO=#658594

# i3 workspace/client roles
# Focus uses the Ink primary accent. Active and inactive clients step through
# the sumiInk/Dragon structural colors, while urgent windows use Dragon Red
# over the upstream winterRed surface.
FOCUSED_BORDER=#C4B28A
FOCUSED_BG=#2A2A37
ACTIVE_BORDER=#625E5A
ACTIVE_BG=#181820
INACTIVE_BORDER=#393836
INACTIVE_BG=#1F1F28
URGENT_BORDER=#C4746E
URGENT_BG=#43242B

# ANSI terminal palette
# Normal colors follow kanagawa-paper.nvim's Ink terminal mapping where
# practical. Bright entries use related brighter colors from the same upstream
# palette so terminal output remains recognizably Kanagawa Paper.
ANSI_BLACK=#393836
ANSI_RED=#C4746E
ANSI_GREEN=#699469
ANSI_YELLOW=#C4B28A
ANSI_BLUE=#435965
ANSI_PURPLE=#A292A3
ANSI_CYAN=#8EA49E
ANSI_WHITE=#C8C093

ANSI_BRIGHT_BLACK=#625E5A
ANSI_BRIGHT_RED=#E46876
ANSI_BRIGHT_GREEN=#98BB6C
ANSI_BRIGHT_YELLOW=#E6C384
ANSI_BRIGHT_BLUE=#7FB4CA
ANSI_BRIGHT_PURPLE=#957FB8
ANSI_BRIGHT_CYAN=#A3D4D5
ANSI_BRIGHT_WHITE=#DCD7BA
