#--------------------------------------------
# file:     i3blocks.conf
# author:   Mike Redd
# version:  1.5
# desc:     Arakiel system console
#--------------------------------------------

separator=true
separator_block_width=10

[disk-root]
label=󰋊  SD 
command=~/.config/i3/scripts/disk /
interval=30
color=#B4C0CB
background=#10161C

[disk-nvme]
label=󰋊  NV 
command=~/.config/i3/scripts/disk /mnt/nvme1
interval=30
color=#D1D8DF
background=#151C23

[lan]
label=󰈀  
command=~/.config/i3/scripts/iface end0
interval=10
color=#91B8CA
background=#10161C

[net]
label=󰓅  
command=~/.config/i3/scripts/bandwidth end0
interval=2
color=#82A9BF
background=#151C23

[cpu]
label=  
command=~/.config/i3/scripts/cpu_usage
interval=2
color=#8FC6C1
background=#10161C

[load]
label=  
command=~/.config/i3/scripts/load_average
interval=5
color=#ABB9C5
background=#151C23

[temp]
label=  
command=~/.config/i3/scripts/temp
interval=5
color=#E5C276
background=#10161C

[updates]
label=󰚰  
command=~/.config/i3/scripts/updates.sh
interval=900
color=#B8A3CA
background=#151C23

[uptime]
label=󰔟  
command=~/.config/i3/scripts/uptime_short
interval=60
color=#A7B2BC
background=#10161C

[time]
label=  
command=date '+%a  %b %d   %H:%M'
interval=1
color=#F3F5F7
background=#19232D
