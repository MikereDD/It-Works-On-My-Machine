# ~/.config/tmux/bindings.conf
# Familiar controls first; modern features around them.

# ── Prefix ────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a

# Preserve old muscle memory.
bind C-a last-window
bind a send-prefix

# ── Configuration ─────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \;\
    display-message "tmux configuration reloaded"

# ── Windows and splits ────────────────────────────────────────
unbind '"'
unbind %

bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ── Vim-style navigation — preserved ─────────────────────────
# h/l move through windows; j/k cycle panes, matching the old config.
bind -r h previous-window
bind -r l next-window
bind -r j select-pane -t :.-
bind -r k select-pane -t :.+

# Swap panes.
bind -r J swap-pane -D
bind -r K swap-pane -U

# Resizing without taking over the established navigation keys.
bind -r H resize-pane -L 3
bind -r L resize-pane -R 3
bind -r M-j resize-pane -D 2
bind -r M-k resize-pane -U 2

bind z resize-pane -Z
bind ! break-pane -d

# ── Vi copy mode ──────────────────────────────────────────────
bind [ copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel

# ── Native chooser ────────────────────────────────────────────
bind "'" choose-tree -Zw

# ── Pane management ───────────────────────────────────────────
bind x confirm-before -p "Kill pane #P? (y/n)" kill-pane
bind X confirm-before -p "Kill window #W? (y/n)" kill-window
bind E run-shell "~/.config/tmux/scripts/pane-restart.sh '#{pane_id}'"

# ── Synchronized input ────────────────────────────────────────
bind y set-window-option synchronize-panes \;\
    display-message "Synchronized input: #{?pane_synchronized,ON,OFF}"

# ── Direct popup shortcuts ────────────────────────────────────
bind s display-popup -E -d "#{pane_current_path}" \
    -w 82% -h 78% -T " Scratch Shell " "$SHELL"

bind g display-popup -E \
    -w 92% -h 88% -T " Arakiel Monitor " \
    "command -v btop >/dev/null 2>&1 && exec btop; exec htop"

bind G display-popup -E \
    -w 94% -h 88% -T " System Journal " \
    "journalctl -f"

bind u display-popup -E \
    -w 92% -h 84% -T " URLs in Current Pane " \
    "~/.config/tmux/scripts/url-menu.sh '#{pane_id}'"

bind S display-popup -E \
    -w 78% -h 76% -T " Sessions " \
    "~/.config/tmux/scripts/session-menu.sh"

bind i display-popup -E \
    -w 76% -h 68% -T " Arakiel System " \
    "~/.config/tmux/scripts/system-status.sh; printf '\nPress Enter to close...'; read _"

bind / command-prompt -p "Manual page:" \
    "display-popup -E -w 92% -h 90% -T ' man: %% ' 'man %%'"

bind ? display-popup -E \
    -w 94% -h 90% -T " tmux Key Bindings " \
    "tmux list-keys | less"

# ── Main native menu ──────────────────────────────────────────
bind m display-menu -T " Arakiel tmux " -x C -y C \
    "Scratch shell"            s "display-popup -E -d '#{pane_current_path}' -w 82% -h 78% -T ' Scratch Shell ' '$SHELL'" \
    "System monitor"           g "display-popup -E -w 92% -h 88% -T ' Arakiel Monitor ' 'command -v btop >/dev/null 2>&1 && exec btop; exec htop'" \
    "System information"       i "display-popup -E -w 76% -h 68% -T ' Arakiel System ' '~/.config/tmux/scripts/system-status.sh; printf \"\\nPress Enter to close...\"; read _'" \
    "Follow system journal"    G "display-popup -E -w 94% -h 88% -T ' System Journal ' 'journalctl -f'" \
    "" \
    "Sessions"                 S "display-popup -E -w 78% -h 76% -T ' Sessions ' '~/.config/tmux/scripts/session-menu.sh'" \
    "Sessions/windows/panes"   t "choose-tree -Zw" \
    "URLs in current pane"     u "display-popup -E -w 92% -h 84% -T ' URLs in Current Pane ' '~/.config/tmux/scripts/url-menu.sh \"#{pane_id}\"'" \
    "" \
    "Toggle synchronized input" y "set-window-option synchronize-panes; display-message 'Synchronized input: #{?pane_synchronized,ON,OFF}'" \
    "Restart current pane"      E "run-shell '~/.config/tmux/scripts/pane-restart.sh \"#{pane_id}\"'" \
    "Reload configuration"      r "source-file ~/.config/tmux/tmux.conf; display-message 'tmux configuration reloaded'" \
    "Key bindings"              ? "display-popup -E -w 94% -h 90% -T ' tmux Key Bindings ' 'tmux list-keys | less'"

# ── tmux 3.7 floating pane experiment ─────────────────────────
%if "#{>=:#{version},3.7}"
    bind * new-pane -c "#{pane_current_path}"
%endif
