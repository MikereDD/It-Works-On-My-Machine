# ~/.config/tmux/theme.conf
# Dark graphite / metallic monochrome theme.

set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 48
set -g status-right-length 120

set -g status-style "bg=colour233,fg=colour249"
set -g message-style "bg=colour236,fg=colour255,bold"
set -g message-command-style "bg=colour236,fg=colour255"
set -g mode-style "bg=colour250,fg=colour233,bold"

set -g status-left \
"#[bg=colour252,fg=colour233,bold]  #S  "

setw -g window-status-separator " "
setw -g window-status-style "bg=colour233,fg=colour244"
setw -g window-status-format " #I:#W#{?window_flags,#{window_flags},} "
setw -g window-status-current-style "bg=colour252,fg=colour233,bold"
setw -g window-status-current-format " #I:#W#{?window_flags,#{window_flags},} "
setw -g window-status-activity-style "bg=colour233,fg=colour214,bold"
setw -g window-status-bell-style "bg=colour203,fg=colour233,bold"

set -g status-right \
"#{?pane_synchronized,#[fg=colour214,bold] SYNC #[default],}\
#{?client_prefix,#[fg=colour203,bold] PREFIX #[default],}\
#(~/.config/tmux/scripts/system-status.sh --status) \
#[fg=colour252]%Y-%m-%d #[bold]%H:%M "

# Pane identity and health are visible at a glance.
set -g pane-border-status top
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style \
"#{?pane_synchronized,fg=colour214,bold,#{?pane_in_mode,fg=colour117,bold,fg=colour250}}"
set -g pane-border-format \
" #{?pane_dead,#[fg=colour203,bold]DEAD ,}\
#{?pane_active,#[bold],}#{pane_index}: #{pane_title} \
#[fg=colour242]#{pane_current_command} "

# Popups and menus.
set -g popup-style "bg=colour234,fg=colour252"
set -g popup-border-style "fg=colour250"
set -g menu-style "bg=colour234,fg=colour252"
set -g menu-selected-style "bg=colour252,fg=colour233,bold"
set -g menu-border-style "fg=colour250"
