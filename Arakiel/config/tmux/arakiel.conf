# ~/.config/tmux/arakiel.conf
# Host-specific behavior for the always-on Raspberry Pi.

set -g history-limit 200000
set -g status-interval 5

setw -g monitor-activity on
set -g visual-activity off
set -g visual-bell off
set -g bell-action any

# Do not let dead services quietly look healthy.
setw -g remain-on-exit off

# Useful feedback for unexpected pane exits.
set-hook -g pane-exited \
    'display-message "Pane #{pane_index} exited: #{pane_dead_status}"'
