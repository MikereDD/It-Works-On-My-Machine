# ~/.config/tmux/tmux.conf
# Arakiel tmux — modern native configuration
# Preserves Mike's C-a prefix and Vim-style muscle memory.

# ── Terminal capabilities ─────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",rxvt-unicode*:RGB"
set -as terminal-features ",xterm*:RGB"

%if "#{>=:#{version},3.5}"
    set -g extended-keys on
%endif

# ── Core behavior ─────────────────────────────────────────────
set -g mouse on
set -g focus-events on
set -g history-limit 100000
set -s escape-time 10
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g set-clipboard external
setw -g mode-keys vi

# Keep automatic window names unless the launcher assigns explicit names.
set -g allow-rename on
set -g automatic-rename on

# ── Modular configuration ─────────────────────────────────────
source-file -q ~/.config/tmux/bindings.conf
source-file -q ~/.config/tmux/theme.conf

%if "#{==:#{host_short},arakiel}"
    source-file -q ~/.config/tmux/arakiel.conf
%endif
